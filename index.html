<!-- =================================================
     PARK
     ================================================= -->

<div
    class="scene park-screen"
    id="parkScreen"
>

    <div class="location-label">
        📍 CITY PARK
    </div>

    <div
        class="camera"
        style="background:rgba(0,0,0,.75);"
    >

        <h2>🌳 THE PARK</h2>

        <p>
            A quiet afternoon.
            <br>
            The perfect place to make a memory.
        </p>

        <button
            class="retro-button"
            onclick="parkMemory()"
        >
            🧠 MAKE A MEMORY
        </button>

        <button
            class="retro-button"
            onclick="goToMap()"
        >
            ← LEAVE PARK
        </button>

    </div>

</div>
